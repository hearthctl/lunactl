manifest:
  fields:
    mac:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
run:
  fields:
    action:
      required: true
      example: "light.turn_on"
      selector:
        text:
    data:
      required: true
      example: '{"target":{"entity_id":"light.bed"},"data":{}}'
      selector:
        text:
ac:
  fields:
    device_id:
      required: true
      selector:
        text:
    page_id:
      required: true
      selector:
        text:
    command:
      required: true
      selector:
        select:
          options:
          - cool
          - heat
          - "off"
          - minus
          - plus
