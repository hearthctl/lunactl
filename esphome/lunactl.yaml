esphome:
  name: lunactl
  project:
    name: hearthctl.lunactl
    version: "1.0"
  # Arc labels need the A8 transform for rotated glyphs (see the curved-text spike).
  build_flags:
    - -DLV_USE_ARCLABEL=1
    - -DLV_DRAW_SW_SUPPORT_A8=1
    - -DLV_USE_FLOAT=1
    - -DLV_USE_SNAPSHOT=1
    # ESPHome parses action responses with ArduinoJson's default nesting limit
    # (10), too shallow for Manifests with scene.apply color lists.
    - -DARDUINOJSON_DEFAULT_NESTING_LIMIT=32
  # Copy the header, and include its type before ESPHome's static globals.
  includes: [<core.h>, lunactl/core.h, lunactl/icons.h, lunactl/countdown.h, <ui.h>, lunactl/ui.h, <pager.h>, lunactl/pager.h, <battery.h>, lunactl/battery.h]
  # Runs after the I2C bus (1000) and before the M5IOE1 setup (IO, 900).
  # Mirrors M5GFX's StopWatch power-on. Verified on device: on a battery cold
  # boot the M5IOE1 NACKs for ~50 ms (M5GFX allows up to 500 ms), and the
  # M5PM1 power outputs are already on (PWR_CFG 0x17).
  on_boot:
    priority: 950
    then:
      - lambda: |-
          // M5PM1 (0x6E): I2C idle-sleep off (0x09), watchdog off (0x0A).
          // Its first transfer after idle may NACK, so retry.
          for (uint8_t reg : {0x09, 0x0A}) {
            const uint8_t data[2] = {reg, 0x00};
            for (int i = 0; i < 20 && id(i2c_bus).write(0x6E, data, 2) != i2c::ERROR_OK; i++)
              delay(1);
          }
          // M5IOE1 (0x4F): wait up to 1 s for it to answer, then I2C idle-sleep off (0x23).
          const uint8_t cfg[2] = {0x23, 0x00};
          int waited = 0;
          while (waited < 1000 && id(i2c_bus).write(0x4F, cfg, 2) != i2c::ERROR_OK) {
            delay(1);
            waited++;
          }
          ESP_LOGI("lunactl", "M5IOE1 ready after %d ms", waited);
          // A software restart keeps 3V3_L3B on, so the running CO5300 is reset with
          // only 10 ms before mipi_spi sends SLPOUT, and stays black until a power
          // cycle (#68). Verified on device: resetting it here first (M5IOE1 IO5,
          // mode 0x03, output 0x05) and waiting 150 ms recovers it.
          uint8_t mode_reg = 0x03, out_reg = 0x05, mode[2] = {0, 0}, out[2] = {0, 0};
          id(i2c_bus).write_readv(0x4F, &mode_reg, 1, mode, 2);
          id(i2c_bus).write_readv(0x4F, &out_reg, 1, out, 2);
          uint8_t panel_out[3] = {out_reg, static_cast<uint8_t>(out[0] & ~0x10), out[1]};
          const uint8_t panel_mode[3] = {mode_reg, static_cast<uint8_t>(mode[0] | 0x10), mode[1]};
          id(i2c_bus).write(0x4F, panel_out, 3);
          id(i2c_bus).write(0x4F, panel_mode, 3);
          delay(10);
          panel_out[1] |= 0x10;
          id(i2c_bus).write(0x4F, panel_out, 3);
          delay(150);

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# Disconnected keeps the Manifest in RAM until HA returns; ESPHome's default
# 15 min reboot would replace it with "Keine Verbindung" (ADR 0006).
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  homeassistant_states: true
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    # Log viewers can also subscribe to states. Only HA supplies the contract.
    # Transition only on the first/last HA client; API connections can overlap.
    - if:
        condition:
          lambda: 'return client_info.rfind("Home Assistant ", 0) == 0 && ++id(ha_clients) == 1;'
        then:
          - lambda: id(manifest_core).set_connected(true);
          - script.execute: render_manifest
          - script.execute: manifest_on_connect
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return client_info.rfind("Home Assistant ", 0) == 0 && id(ha_clients) > 0 && --id(ha_clients) == 0;'
        then:
          - script.stop: manifest_on_connect
          - lambda: id(manifest_core).set_connected(false);
          - script.execute: render_manifest

json:

globals:
  - id: ha_clients
    type: unsigned int
    restore_value: false
    initial_value: "0"
  - id: page_ui
    type: lunactl::Pager
    restore_value: false
  - id: tapped_slot
    type: int
    restore_value: false
    initial_value: "-1"
  - id: manifest_core
    type: lunactl::Core
    restore_value: false
  - id: battery
    type: lunactl::Battery
    restore_value: false

# StopWatch: Taste A (yellow) = GPIO2, Taste B (blue) = GPIO1, active low.
# Debounce both edges before the core measures a press.
binary_sensor:
  - platform: gpio
    id: key_a
    internal: true
    pin:
      number: GPIO2
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 10ms
  - platform: gpio
    id: key_b
    internal: true
    pin:
      number: GPIO1
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 10ms

interval:
  # Polling lets a long gesture fire while the key is still held.
  - interval: 10ms
    then:
      - script.execute:
          id: handle_key
          key: 0
          pressed: !lambda return id(key_a).state;
      - script.execute:
          id: handle_key
          key: 1
          pressed: !lambda return id(key_b).state;
      - script.execute: update_display

  - interval: 1s
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          id(manifest_core).set_time(now.hour, now.minute, now.is_valid());
          id(manifest_core).set_timestamp(now.timestamp, now.is_valid());
          id(page_ui).update_time(id(manifest_core));

button:
  - platform: template
    name: Manifest neu laden
    on_press:
      - if:
          condition:
            lambda: return id(manifest_core).connected();
          then:
            - script.execute:
                id: fetch_manifest
                request: !lambda return id(manifest_core).begin_fetch();

script:
  - id: sync_subscriptions
    mode: single
    then:
      # Leave the API response callback before closing its socket.
      - delay: 1ms
      - lambda: |-
          auto &core = id(manifest_core);
          auto action = core.take_connection_action();
          if (action == lunactl::ConnectionAction::RESTART) {
            App.safe_reboot();
          } else if (action == lunactl::ConnectionAction::RECONNECT) {
            for (const auto &ref : core.subscriptions()) {
              api::global_api_server->subscribe_home_assistant_state(
                  ref.entity.c_str(), ref.attribute.empty() ? nullptr : ref.attribute.c_str(),
                  [ref](StringRef state) {
                    id(manifest_core).set_state(ref, std::string(state.c_str(), state.size()));
                    id(render_manifest).execute();
                  });
            }
            // HA learns the registered subscriptions on its next connection.
            // Closing abruptly avoids HA's graceful-disconnect cooldown (#2).
            for (const auto &client : api::global_api_server->active_clients()) client->on_fatal_error();
          }
  - id: wake_display
    then:
      - lambda: |-
          // Keep LVGL input running while dark: the core consumes the wake touch.
          // Only send a CO5300 command when the effective brightness changes.
          static int previous = -1;
          int brightness = id(manifest_core).display_brightness();
          if (brightness != previous) {
            id(amoled).set_brightness(brightness);
            previous = brightness;
            id(manifest_ui).set_paused(false, false);
          }
  - id: run_button_action
    mode: parallel
    parameters:
      action: string
      data: string
    then:
      - homeassistant.action:
          action: lunactl.run
          data:
            action: !lambda return action;
            data: !lambda return data;
          on_error:
            - lambda: 'ESP_LOGW("lunactl", "Button action failed: %s", error.c_str());'
  - id: handle_key
    parameters:
      key: uint8_t
      pressed: bool
    then:
      - lambda: |-
          auto event = id(manifest_core).button(static_cast<lunactl::Key>(key), pressed, millis());
          if (event.wake) id(wake_display).execute();
          if (!event.action.action.empty())
            id(run_button_action).execute(event.action.action, event.action.data);
  - id: update_display
    then:
      - lambda: |-
          if (id(manifest_core).tick(millis())) id(render_manifest).execute();
          id(wake_display).execute();
  - id: render_battery
    then:
      - lambda: |-
          auto text = id(battery).text();
          if (std::strcmp(lv_label_get_text(id(battery_level_text)), text.c_str()) != 0)
            lv_label_set_text(id(battery_level_text), text.c_str());
          if (std::strcmp(lv_label_get_text(id(battery_hint)), id(battery).hint()) != 0)
            lv_label_set_text(id(battery_hint), id(battery).hint());
  - id: manifest_on_connect
    mode: restart
    then:
      # HA subscribes to device actions after the initial API handshake.
      - delay: 1s
      - script.execute:
          id: fetch_manifest
          request: !lambda return id(manifest_core).begin_fetch();
  - id: fetch_manifest
    mode: parallel
    parameters:
      request: uint32_t
    then:
      - homeassistant.action:
          action: lunactl.manifest
          data:
            mac: !lambda return get_mac_address_pretty();
          capture_response: true
          on_success:
            - lambda: |-
                std::string error;
                if (!id(manifest_core).accept(request, response["response"], error))
                  ESP_LOGW("lunactl", "Manifest rejected: %s", error.c_str());
            - script.execute: render_manifest
            - script.execute: sync_subscriptions
          on_error:
            - lambda: |-
                if (id(manifest_core).current(request))
                  ESP_LOGW("lunactl", "Manifest fetch failed: %s", error.c_str());
  - id: render_manifest
    then:
      - lambda: |-
          auto &core = id(manifest_core);
          lv_label_set_text(id(manifest_status), core.status());
          id(page_ui).init(id(touch_surface), id(font_item)->get_lv_font(), id(font_icon)->get_lv_font(), id(countdown_ring), id(font_battery)->get_lv_font(), id(font_countdown)->get_lv_font(), id(font_dial)->get_lv_font());
          id(page_ui).render(core);
          lv_obj_move_foreground(id(battery_hint));
          lv_obj_move_foreground(id(battery_level_text));
          lv_obj_move_foreground(id(manifest_status));
          lv_obj_move_foreground(id(offline_icon));
          if (core.shown()) lv_obj_add_flag(id(manifest_status), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_remove_flag(id(manifest_status), LV_OBJ_FLAG_HIDDEN);
          if (core.offline_icon()) lv_obj_remove_flag(id(offline_icon), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(offline_icon), LV_OBJ_FLAG_HIDDEN);
          id(wake_display).execute();

# HA supplies local time and timezone; no household credentials or entity needed.
time:
  - platform: homeassistant
    id: ha_time

# OTA uses the api encryption key.
ota:
  - platform: esphome
    encryption:

external_components:
  - source:
      type: git
      url: https://github.com/m5stack/esphome-yaml
      ref: f76024e1527b38170350be62c9c01fe29488319d
    components: [m5ioe1]

i2c:
  id: i2c_bus
  sda: GPIO47
  scl: GPIO48

i2c_device:
  id: pmic
  address: 0x6E

sensor:
  - platform: template
    id: battery_level
    name: Akkustand
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const bool valid = id(battery).poll([](uint8_t reg, uint8_t *data, size_t length) {
        if (id(pmic).read_register(reg, data, length) == i2c::ERROR_OK) return true;
        delay(1);
        return false;
      });
      if (!valid) ESP_LOGW("lunactl", "M5PM1 battery unavailable");
      // Refresh also on failure, clearing any stale low-battery hint.
      id(render_battery).execute();
      return valid ? id(battery).level() : NAN;

# Expander pin numbers are 0-based: number N is the expander's IO(N+1).
m5ioe1:
  id: ioe
  address: 0x4F
  # A software reset may restore the I2C idle-sleep disabled in on_boot.
  reset: false

# 3V3_L3B powers display and touch. Turned on before the display sets up.
switch:
  - platform: gpio
    id: rail_3v3_l3b
    restore_mode: ALWAYS_ON
    pin:
      m5ioe1_id: ioe
      number: 7
      mode:
        output: true

spi:
  type: quad
  clk_pin: GPIO40
  data_pins: [GPIO41, GPIO42, GPIO46, GPIO45]

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    brightness: 179  # 70% of the CO5300's 0–255 range.
    bus_mode: quad
    data_rate: 80MHz
    color_order: rgb
    cs_pin: GPIO39
    reset_pin:
      m5ioe1_id: ioe
      number: 4
      mode:
        output: true
    dimensions:
      width: 466
      height: 466
      offset_width: 6
      offset_height: 0

# Verified on device: CST820 at 0x15 reports raw coordinates over the full
# 0..466 range, so no calibration is needed.
touchscreen:
  - platform: cst816
    id: touch
    display: amoled
    interrupt_pin: GPIO13
    reset_pin:
      m5ioe1_id: ioe
      number: 3
      mode:
        output: true
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw_x=%d raw_y=%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]

font:
  - id: font_battery
    file: "gfonts://Nunito@800"
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - id: font_item
    file: "gfonts://Nunito@800"
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - id: font_countdown
    file: "gfonts://Nunito@800"
    size: 48
    bpp: 4
    glyphs: "0123456789: s"
  # Dial's large value: digits and the few signs a temperature or percentage needs.
  - id: font_dial
    file: "gfonts://Nunito@800"
    size: 96
    bpp: 4
    glyphs: "0123456789,.-–°% "
  - id: font_icon
    file: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    size: 48
    bpp: 4
    glyphs:
