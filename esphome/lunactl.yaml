esphome:
  name: lunactl
  # Copy the header, and include its type before ESPHome's static globals.
  includes: [<core.h>, lunactl/core.h]
  # Runs after the I2C bus (1000) and before the M5IOE1 setup (IO, 900).
  # Mirrors M5GFX's StopWatch power-on. Verified on device: on a battery cold
  # boot the M5IOE1 NACKs for ~50 ms (M5GFX allows up to 500 ms), and the
  # M5PM1 power outputs are already on (PWR_CFG 0x17).
  on_boot:
    priority: 950
    then:
      - lambda: |-
          // M5PM1 (0x6E): I2C idle-sleep off (0x09), watchdog off (0x0A).
          // Its first transfer after idle may NACK, so retry.
          for (uint8_t reg : {0x09, 0x0A}) {
            const uint8_t data[2] = {reg, 0x00};
            for (int i = 0; i < 20 && id(i2c_bus).write(0x6E, data, 2) != i2c::ERROR_OK; i++)
              delay(1);
          }
          // M5IOE1 (0x4F): wait up to 1 s for it to answer, then I2C idle-sleep off (0x23).
          const uint8_t cfg[2] = {0x23, 0x00};
          int waited = 0;
          while (waited < 1000 && id(i2c_bus).write(0x4F, cfg, 2) != i2c::ERROR_OK) {
            delay(1);
            waited++;
          }
          ESP_LOGI("lunactl", "M5IOE1 ready after %d ms", waited);

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    # Log viewers can also subscribe to states. Only HA supplies the contract.
    - if:
        condition:
          lambda: 'return client_info.rfind("Home Assistant ", 0) == 0;'
        then:
          - lambda: id(manifest_core).set_connected(true);
          - script.execute: render_manifest
          - script.execute: manifest_on_connect
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return client_info.rfind("Home Assistant ", 0) == 0;'
        then:
          - script.stop: manifest_on_connect
          - lambda: id(manifest_core).set_connected(false);
          - script.execute: render_manifest

json:

globals:
  - id: manifest_core
    type: lunactl::Core
    restore_value: false

button:
  - platform: template
    name: Manifest neu laden
    on_press:
      - if:
          condition:
            lambda: return id(manifest_core).connected();
          then:
            - script.execute:
                id: fetch_manifest
                request: !lambda return id(manifest_core).begin_fetch();

script:
  - id: manifest_on_connect
    mode: restart
    then:
      # HA subscribes to device actions after the initial API handshake.
      - delay: 1s
      - script.execute:
          id: fetch_manifest
          request: !lambda return id(manifest_core).begin_fetch();
  - id: fetch_manifest
    mode: parallel
    parameters:
      request: uint32_t
    then:
      - homeassistant.action:
          action: script.lunactl_manifest
          data:
            mac: !lambda return get_mac_address_pretty();
          capture_response: true
          on_success:
            - lambda: |-
                std::string error;
                if (!id(manifest_core).accept(request, response["response"], error))
                  ESP_LOGW("lunactl", "Manifest rejected: %s", error.c_str());
            - script.execute: render_manifest
          on_error:
            - lambda: |-
                if (id(manifest_core).current(request))
                  ESP_LOGW("lunactl", "Manifest fetch failed: %s", error.c_str());
  - id: render_manifest
    then:
      - lambda: |-
          auto &core = id(manifest_core);
          lv_label_set_text(id(manifest_status), core.status());
          if (core.tappable()) {
            lv_obj_remove_flag(id(single_item), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(manifest_status), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(item_label), core.item().label.c_str());
            lv_obj_set_style_bg_color(id(single_item), lv_color_hex(core.item().rgb), LV_PART_MAIN);
          } else {
            lv_obj_add_flag(id(single_item), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(manifest_status), LV_OBJ_FLAG_HIDDEN);
          }

# OTA uses the api encryption key.
ota:
  - platform: esphome
    encryption:

external_components:
  - source:
      type: git
      url: https://github.com/m5stack/esphome-yaml
      ref: f76024e1527b38170350be62c9c01fe29488319d
    components: [m5ioe1]

i2c:
  id: i2c_bus
  sda: GPIO47
  scl: GPIO48

# Expander pin numbers are 0-based: number N is the expander's IO(N+1).
m5ioe1:
  id: ioe
  address: 0x4F
  # A software reset may restore the I2C idle-sleep disabled in on_boot.
  reset: false

# 3V3_L3B powers display and touch. Turned on before the display sets up.
switch:
  - platform: gpio
    id: rail_3v3_l3b
    restore_mode: ALWAYS_ON
    pin:
      m5ioe1_id: ioe
      number: 7
      mode:
        output: true

spi:
  type: quad
  clk_pin: GPIO40
  data_pins: [GPIO41, GPIO42, GPIO46, GPIO45]

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    bus_mode: quad
    color_order: rgb
    cs_pin: GPIO39
    reset_pin:
      m5ioe1_id: ioe
      number: 4
      mode:
        output: true
    dimensions:
      width: 466
      height: 466
      offset_width: 6
      offset_height: 0

# Verified on device: CST820 at 0x15 reports raw coordinates over the full
# 0..466 range, so no calibration is needed.
touchscreen:
  - platform: cst816
    id: touch
    display: amoled
    interrupt_pin: GPIO13
    reset_pin:
      m5ioe1_id: ioe
      number: 3
      mode:
        output: true
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw_x=%d raw_y=%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]

font:
  - id: font_item
    file: "gfonts://Nunito@800"
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Core]

lvgl:
  displays: [amoled]
  touchscreens: [touch]
  bg_color: 0x000000
  widgets:
    - label:
        id: manifest_status
        align: center
        text: Keine Verbindung
        text_font: font_item
        text_color: 0xFFFFFF
    - button:
        id: single_item
        align: center
        width: 280
        height: 280
        radius: 140
        hidden: true
        bg_color: 0x000000
        text_color: 0xFFFFFF
        shadow_width: 0
        widgets:
          - label:
              id: item_label
              align: center
              width: 240
              text_align: center
              long_mode: WRAP
              text_font: font_item
              text: ""
        on_click:
          - if:
              condition:
                lambda: return id(manifest_core).tappable();
              then:
                - homeassistant.action:
                    action: script.lunactl_run
                    data:
                      action: !lambda return id(manifest_core).item().action;
                      data: !lambda return id(manifest_core).item().data;
                    on_error:
                      - lambda: 'ESP_LOGW("lunactl", "Item action failed: %s", error.c_str());'
