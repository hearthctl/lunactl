lvgl:
  id: manifest_ui
  displays: [amoled]
  touchscreens: [touch]
  bg_color: 0x000000
  widgets:
    # Declaring the arc here enables LVGL's arc module. UI reparents and styles
    # this same object with the Single, Pie center or Dial page; it stays inert and initially hidden.
    - arc:
        id: countdown_ring
        hidden: true
        adjustable: false
    - label:
        id: manifest_status
        align: center
        text: Keine Verbindung
        text_font: font_item
        text_color: 0xFFFFFF
    # Disconnected (ADR 0006): fixed above the pages, covering a Pie center's clock.
    - obj:
        id: offline_icon
        align: top_mid
        y: 3
        width: 64
        height: 64
        radius: 32
        bg_color: 0x000000
        border_width: 0
        pad_all: 0
        hidden: true
        clickable: false
        scrollable: false
        widgets:
          - label:
              align: center
              text: "\U000F05AA" # mdi:wifi-off
              text_font: font_icon
              text_color: 0xFFFFFF
    # Pager fills this input surface with scrollable pages. Core keeps tap
    # hit-testing and action selection; scrolling cancels the pending tap.
    - button:
        id: touch_surface
        align: center
        width: 466
        height: 466
        radius: 233
        bg_opa: TRANSP
        border_width: 0
        shadow_width: 0
        pad_all: 0
        # ESPHome 2026.10.2 supplies widget-relative `lv_point_t point` to
        # both triggers (components/lvgl/trigger.py:add_trigger).
        on_press:
          - lambda: |-
              bool active = id(manifest_core).press(point.x, point.y, millis());
              id(page_ui).highlight(id(manifest_core), active ? point.x : -1, active ? point.y : -1);
              id(wake_display).execute();
        on_release:
          - lambda: |-
              id(tapped_slot) = id(manifest_core).release(point.x, point.y, millis());
          - script.execute: render_manifest
          - if:
              condition:
                lambda: return id(tapped_slot) >= 0;
              then:
                - homeassistant.action:
                    action: lunactl.run
                    data:
                      action: !lambda return id(manifest_core).item(id(tapped_slot)).action;
                      data: !lambda return id(manifest_core).item(id(tapped_slot)).data;
                    on_error:
                      - lambda: 'ESP_LOGW("lunactl", "Item action failed: %s", error.c_str());'
    - label:
        id: battery_hint
        align: bottom_mid
        y: -64
        text: ""
        text_font: font_battery
        text_color: 0xFFFFFF
    - label:
        id: battery_level_text
        align: bottom_mid
        y: -36
        text: "Akku -- %"
        text_font: font_battery
        text_color: 0xFFFFFF
