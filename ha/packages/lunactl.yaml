# lunactl: the HA side of the control panel. The device triggers only the
# lunactl_ scripts below and holds no room logic.
#
# Decke: light.decke
# Bett:  light.bett

script:
  lunactl_hell:
    alias: lunactl Hell
    sequence:
      - action: light.turn_on
        target:
          entity_id:
            - light.decke
            - light.bett
        data:
          brightness_pct: 100
          color_temp_kelvin: 4000

  lunactl_lesen:
    alias: lunactl Lesen
    sequence:
      - action: light.turn_off
        target:
          entity_id: light.decke
      - action: light.turn_on
        target:
          entity_id: light.bett
        data:
          brightness_pct: 80
          color_temp_kelvin: 2700

  lunactl_gemuetlich:
    alias: lunactl Gemütlich
    sequence:
      - action: light.turn_on
        target:
          entity_id:
            - light.decke
            - light.bett
        data:
          brightness_pct: 80
          color_temp_kelvin: 2700

  lunactl_schlafen_gehen:
    alias: lunactl Schlafen gehen
    sequence:
      - action: light.turn_off
        target:
          entity_id: light.decke
      # transition 0: Bett goes straight to 8 %, without the default fade.
      - action: light.turn_on
        target:
          entity_id: light.bett
        data:
          brightness_pct: 8
          color_temp_kelvin: 2700
          transition: 0

  lunactl_taste_a:
    alias: lunactl Taste A
    sequence:
      - if:
          - condition: state
            entity_id: light.decke
            state: "on"
        then:
          - action: script.lunactl_schlafen_gehen
        else:
          - action: script.lunactl_gemuetlich
