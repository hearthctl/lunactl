# Disposable Home Assistant for the lunactl tests. Never used in production.
homeassistant:
  packages: !include_dir_named packages

http:

api:

# Stand-ins for the two room lights. Optimistic template lights keep
# whatever brightness and colour temperature they are told to.
template:
  - light:
      - name: Decke
        supports_transition: true
        turn_on: []
        turn_off: []
        set_level: []
        set_temperature: []
      - name: Bett
        supports_transition: true
        turn_on: []
        turn_off: []
        set_level: []
        set_temperature: []
