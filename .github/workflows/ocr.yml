name: OCR
run-name: "OCR PR #${{ github.event.pull_request.number }}"
on:
  pull_request_target:
    # `opened` is absent: a pull request created with its label also fires
    # `labeled`, and both events would each run a full review.
    types: [synchronize, reopened, labeled, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.repository == 'hearthctl/lunactl' &&
      contains(github.event.pull_request.labels.*.name, 'agent-managed') &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent-managed')
    runs-on: kelos-ocr
    timeout-minutes: 45
    steps:
      - name: Record trusted event identity
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          mkdir -p "${RUNNER_TEMP}/kelos-ocr"
          jq --arg repository "$GITHUB_REPOSITORY" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" '{repository: $repository, run: $run, attempt: $attempt, pr: .pull_request.number, head: .pull_request.head.sha, base: .pull_request.base.sha}' <<< "$EVENT_JSON" > "${RUNNER_TEMP}/kelos-ocr/identity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kelos-ocr-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kelos-ocr/identity.json
          if-no-files-found: error
      # The action checks out the trusted base; never check out or execute PR code here.
      - id: ocr
        uses: alibaba/open-code-review@7e5ce06c88de5ce81df5dc4f24e2e485b517fae8 # v1.13.10
        with:
          ocr_version: '1.13.10'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: 'false'
          llm_protocol: openai
          rule: .opencodereview/rule.json
          upload_artifacts: 'true'
          incremental: 'false'
          resolve_outdated: 'false'
      - name: Record publication evidence
        env:
          OCR_SUMMARY: ${{ steps.ocr.outputs.summary_comment_url }}
          OCR_TOTAL: ${{ steps.ocr.outputs.comments_total }}
          OCR_FAILED: ${{ steps.ocr.outputs.comments_failed }}
        run: |
          jq --arg base "$MERGE_BASE" --arg summary "$OCR_SUMMARY" --argjson total "$OCR_TOTAL" --argjson failed "$OCR_FAILED" '. + {base: $base, summary: $summary, total: $total, failed: $failed}' "${RUNNER_TEMP}/kelos-ocr/identity.json" > "${RUNNER_TEMP}/kelos-ocr/publication.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kelos-ocr-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kelos-ocr/publication.json
          if-no-files-found: error
