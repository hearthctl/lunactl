name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    # GitHub-hosted: provides the C++ compiler, curl, sha256sum and Podman the checks need.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The ESP32 toolchain is a large download that only changes with the ESPHome version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('Makefile') }}
      # `check` runs every seam plus the firmware build. Until it exists on
      # main, fall back to the firmware build alone.
      - run: make "$(grep -q '^check:' Makefile && echo check || echo check-firmware)"
